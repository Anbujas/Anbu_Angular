<main class="portfolio-shell">
  <section class="hero" id="top">
    <div class="hero-photo">
      <img [src]="profile.photo" width="280" height="360" alt="Portrait of {{ profile.name }}" />
    </div>

    <div class="hero-copy">
      <h1>{{ profile.name | uppercase }}</h1>
      <p class="hero-title">{{ profile.title }}</p>
      <p class="hero-bio">{{ profile.bio }}</p>

      <ul class="social-links">
        <li *ngFor="let link of profile.social">
          <a
            [href]="link.href"
            [attr.target]="link.icon === 'github' || link.icon === 'website' ? '_blank' : null"
            [attr.rel]="link.icon === 'github' || link.icon === 'website' ? 'noopener noreferrer' : null"
          >
            <span class="social-icon" aria-hidden="true" [ngSwitch]="link.icon">
              <svg *ngSwitchCase="'email'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M3 7l9 6 9-6" />
              </svg>
              <svg *ngSwitchCase="'github'" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
              </svg>
              <svg *ngSwitchCase="'linkedin'" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 11.001-4.124 2.062 2.062 0 01-.001 4.124zM7.114 20.452H3.558V9h3.556v11.452z" />
              </svg>
              <svg *ngSwitchCase="'website'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="9" />
                <ellipse cx="12" cy="12" rx="4" ry="9" />
                <path d="M3 12h18" />
              </svg>
            </span>
            <span class="social-label">{{ link.label }}</span>
          </a>
        </li>
      </ul>
    </div>
  </section>

  <section id="about">
    <app-about-me></app-about-me>
  </section>

  <section class="card-section" id="projects">
    <p class="section-kicker">Selected Work</p>
    <p class="section-subtitle">Ten projects that shaped my engineering career</p>
    <div class="card-grid">
      <app-portfolio-card *ngFor="let card of cards" [card]="card" (learnMore)="openCaseStudy($event)"></app-portfolio-card>
    </div>
  </section>

  <section class="cta-row" id="contact">
    <a class="cta-button emerald" [href]="'mailto:' + profile.email">Connect with me</a>
    <a class="cta-button teal" [href]="profile.resumeUrl" download="Anbu_Murugesan_Resume.pdf">Download my resume</a>
  </section>

  <footer class="footer">
    <small>© {{ currentYear }} {{ profile.name }}</small>
  </footer>
</main>

<app-case-study-modal [card]="selectedCard" (closed)="closeCaseStudy()"></app-case-study-modal>
